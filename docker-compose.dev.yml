# Ambiente de DESENVOLVIMENTO LOCAL para os agentes de Previsão e Vazamento.
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   python -m pytest -q
#   docker compose -f docker-compose.dev.yml down
#
# Postgres: db/postgres-init/ roda em ordem alfabética só na primeira inicialização.
#   Os arquivos 01, 02, 03, 05 e 06 são cópias do delta-sql-database (fonte de verdade
#   do schema); não edite à mão, re-sincronize se o schema mudar. O 04-local-roles.sql
#   existe só aqui: cria as roles sys_* que o datamart cita nos GRANTs.
# Mongo: sobe vazio. Para popular, use o delta-hardware-data-simulator
#   (python -m dataload.cli <coleção> <quantidade>). Os testes não dependem disso.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./db/postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    # 27018 no host, nao 27017: evita conflito com um MongoDB local ja
    # instalado como servico no Windows (porta padrao ocupada fora do Docker).
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
