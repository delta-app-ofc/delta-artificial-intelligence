name: Avaliação de segurança offline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar o avaliador
        run: python -m pytest tests/test_safety_evaluation.py -q
      - name: Avaliar regras e impedir regressões
        run: python -m scripts.evaluate_safety
      - name: Publicar relatório com lacunas conhecidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-evaluation
          path: reports/safety-evaluation.json
          if-no-files-found: warn
